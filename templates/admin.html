{% extends "base.html" %}
{% block title %}管理面板{% endblock %}

{% block content %}
<div class="bg-gray-50 min-h-screen pt-14 pb-16">
    <div class="max-w-6xl mx-auto px-4">
        <div class="pt-8 mb-10 fade-up">
            <h2 class="text-3xl md:text-4xl font-extrabold text-amber-700 mb-2">
                <i class="fas fa-shield-alt mr-2"></i>管理面板
            </h2>
            <p class="text-gray-500">内容审核 · 素材管理 · 用户总览</p>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-10 fade-up">
            <div class="bg-white rounded-2xl shadow p-6 text-center border-t-4 border-tech-blue">
                <p id="stat-users" class="text-3xl font-extrabold text-tech-blue">-</p>
                <p class="text-xs text-gray-400 mt-1">注册用户</p>
            </div>
            <div class="bg-white rounded-2xl shadow p-6 text-center border-t-4 border-emerald-500">
                <p id="stat-materials" class="text-3xl font-extrabold text-emerald-600">-</p>
                <p class="text-xs text-gray-400 mt-1">共创素材</p>
            </div>
            <div class="bg-white rounded-2xl shadow p-6 text-center border-t-4 border-amber-500">
                <p id="stat-comments" class="text-3xl font-extrabold text-amber-600">-</p>
                <p class="text-xs text-gray-400 mt-1">留言总数</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 留言管理 -->
            <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 fade-up">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-3">
                    <i class="fas fa-comments text-tech-blue mr-2"></i>留言管理
                    <span id="c-count" class="text-xs text-gray-400 font-normal"></span>
                </h3>
                <div id="admin-comments" class="space-y-3 max-h-[26rem] overflow-y-auto pr-1"></div>
            </div>

            <!-- 素材管理 -->
            <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 fade-up">
                <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-3">
                    <i class="fas fa-images text-emerald-600 mr-2"></i>素材管理
                    <span id="m-count" class="text-xs text-gray-400 font-normal"></span>
                </h3>
                <div id="admin-materials" class="space-y-3 max-h-[26rem] overflow-y-auto pr-1"></div>
            </div>
        </div>

        <!-- 用户列表 -->
        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 mt-8 fade-up">
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-3">
                <i class="fas fa-users text-birch-accent mr-2"></i>用户总览
            </h3>
            <div id="admin-users" class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-gray-400 border-b border-gray-100">
                        <tr><th class="py-2 pr-4">ID</th><th class="py-2 pr-4">用户名</th><th class="py-2 pr-4">角色</th><th class="py-2">注册时间</th></tr>
                    </thead>
                    <tbody id="users-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const KEY_LABEL = { wall: '留言墙' };
function keyLabel(k){ return KEY_LABEL[k] || k; }

async function loadAdmin() {
    const data = await (await fetch('/api/admin/overview')).json();
    if (!data.ok) return;
    document.getElementById('stat-users').innerText = data.users.length;
    document.getElementById('stat-materials').innerText = data.materials.length;
    document.getElementById('stat-comments').innerText = data.comments.length;
    document.getElementById('c-count').innerText = `（${data.comments.length}）`;
    document.getElementById('m-count').innerText = `（${data.materials.length}）`;

    document.getElementById('admin-comments').innerHTML = data.comments.map(c => `
        <div class="flex items-start gap-3 bg-gray-50 rounded-xl p-3 text-sm">
            <div class="flex-1 min-w-0">
                <div class="text-xs text-gray-400 mb-1">
                    <span class="font-bold text-gray-600">${esc(c.author)}</span>
                    <span class="mx-1">·</span><span>${esc(c.created_at)}</span>
                    <span class="ml-2 bg-tech-light text-tech-blue text-[10px] px-1.5 py-0.5 rounded">${esc(keyLabel(c.key))}</span>
                </div>
                <p class="text-gray-700 break-words">${esc(c.content)}</p>
            </div>
            <button onclick="adminDel('comments', ${c.id}, this)" class="text-gray-300 hover:text-rose-500 px-2"><i class="fas fa-trash"></i></button>
        </div>`).join('') || '<p class="text-center text-gray-300 py-8">暂无留言</p>';

    document.getElementById('admin-materials').innerHTML = data.materials.map(m => `
        <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3 text-sm">
            <img src="${m.src}" class="w-14 h-14 rounded-lg object-cover flex-shrink-0" alt="">
            <div class="flex-1 min-w-0">
                <p class="font-bold text-gray-700 truncate">${esc(m.title)}</p>
                <p class="text-xs text-gray-400">${esc(m.author)} · ${esc(m.created_at)}</p>
            </div>
            <a href="${m.src}" download class="text-tech-blue px-2"><i class="fas fa-download"></i></a>
            <button onclick="adminDel('materials', ${m.id}, this)" class="text-gray-300 hover:text-rose-500 px-2"><i class="fas fa-trash"></i></button>
        </div>`).join('') || '<p class="text-center text-gray-300 py-8">暂无用户素材</p>';

    document.getElementById('users-tbody').innerHTML = data.users.map(u => `
        <tr class="border-b border-gray-50">
            <td class="py-2.5 pr-4 text-gray-400">${u.id}</td>
            <td class="py-2.5 pr-4 font-bold text-gray-700">${esc(u.username)}</td>
            <td class="py-2.5 pr-4">${u.is_admin
                ? '<span class="text-amber-600 bg-amber-50 px-2 py-0.5 rounded text-xs">管理员</span>'
                : '<span class="text-gray-500 text-xs">普通用户</span>'}</td>
            <td class="py-2.5 text-gray-400">${esc(u.created_at)}</td>
        </tr>`).join('');
}

async function adminDel(type, id, btn) {
    if (!confirm('确定删除？此操作不可恢复。')) return;
    const url = type === 'comments' ? `/api/comments/${id}` : `/api/materials/${id}`;
    const data = await (await fetch(url, { method: 'DELETE' })).json();
    if (data.ok) loadAdmin();
    else alert(data.msg || '删除失败');
}

loadAdmin();
</script>
{% endblock %}
