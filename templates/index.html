{% extends "base.html" %}
{% block title %}首页{% endblock %}

{% block content %}
<div class="relative min-h-screen flex flex-col items-center justify-center select-none pt-10 pb-16 hero-birch overflow-hidden">

    <!-- 底部白桦林剪影 -->

        <defs>
            <linearGradient id="trunkG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fffdf6" stop-opacity="0"/>
                <stop offset=".5" stop-color="#fffdf6" stop-opacity=".85"/>
                <stop offset="1" stop-color="#f6efdf"/>
            </linearGradient>
            <linearGradient id="trunkMask" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/>
                <stop offset=".45" stop-color="#fff" stop-opacity="1"/>
                <stop offset="1" stop-color="#fff"/>
            </linearGradient>
            <mask id="treesFade"><rect x="0" y="0" width="1440" height="190" fill="url(#trunkMask)"/></mask>
        </defs>
        <g mask="url(#treesFade)" fill="url(#trunkG)">
            <rect x="72"  y="18" width="56" height="172" rx="10"/>
            <rect x="298" y="46" width="38" height="144" rx="8"/>
            <rect x="512" y="0"  width="64" height="190" rx="11"/>
            <rect x="762" y="34" width="44" height="156" rx="9"/>
            <rect x="1012" y="8" width="58" height="182" rx="10"/>
            <rect x="1246" y="52" width="40" height="138" rx="8"/>
        </g>
        <g mask="url(#treesFade)" fill="#4a3626" opacity=".55">
            <rect x="84"  y="60"  width="30" height="7" rx="3.5"/>
            <rect x="92"  y="128" width="22" height="6" rx="3"/>
            <rect x="306" y="92"  width="20" height="6" rx="3"/>
            <rect x="308" y="150" width="15" height="5" rx="2.5"/>
            <rect x="528" y="48"  width="34" height="8" rx="4"/>
            <rect x="534" y="120" width="24" height="6" rx="3"/>
            <rect x="540" y="162" width="18" height="5" rx="2.5"/>
            <rect x="772" y="84"  width="24" height="6" rx="3"/>
            <rect x="778" y="148" width="17" height="5" rx="2.5"/>
            <rect x="1026" y="56" width="30" height="7" rx="3.5"/>
            <rect x="1032" y="136" width="20" height="6" rx="3"/>
            <rect x="1256" y="100" width="20" height="6" rx="3"/>
        </g>
    </svg>

    <div class="text-center mb-6 w-full relative z-10 fade-up">
        <h1 class="font-display text-5xl md:text-7xl font-bold text-birch-dark mb-4 tracking-[.3em] inline-flex items-center gap-4 md:gap-6">
            桦艺新生<span class="hero-seal font-display"><svg viewBox="0 0 48 48" aria-hidden="true"><text x="24" y="24" text-anchor="middle" dominant-baseline="central" font-size="30">桦</text></svg></span>
        </h1>
        <h2 class="font-display text-2xl md:text-3xl text-birch-accent font-bold mb-6 tracking-[.2em]">桦树皮画数字体验平台</h2>
        <p class="text-sm md:text-base text-gray-500 tracking-widest max-w-3xl mx-auto px-4">
            北方民族的传统艺术瑰宝 <span class="mx-2 text-birch-accent">|</span> 国家级非遗 · 编号 Ⅷ-83 <span class="mx-2 text-birch-accent">|</span> 数字化创新探索
        </p>
    </div>

    <div class="scene">
        <div class="cube" id="cube">
            <a class="face front" href="/ar">
                <i class="fas fa-vr-cardboard mb-3 text-4xl text-birch-accent"></i>
                <span>AR 试贴体验</span>
            </a>
            <a class="face right" href="/ai">
                <i class="fas fa-robot mb-3 text-4xl text-birch-accent"></i>
                <span>AI 智能问答</span>
            </a>
            <a class="face back" href="/gallery">
                <i class="fas fa-image mb-3 text-4xl text-birch-accent"></i>
                <span>全景视听展馆</span>
            </a>
            <a class="face left" href="/material">
                <i class="fas fa-images mb-3 text-4xl text-birch-accent"></i>
                <span>桦艺素材库</span>
            </a>
            <a class="face top" href="/inheritors">
                <i class="fas fa-users mb-3 text-4xl text-birch-accent"></i>
                <span>传承人故事</span>
            </a>
            <a class="face bottom" href="/create">
                <i class="fas fa-shapes mb-3 text-4xl text-birch-accent"></i>
                <span>拼贴创作</span>
            </a>
        </div>
    </div>

    <p class="relative z-10 text-gray-500 mt-10 inline-flex items-center gap-2 text-sm border border-birch/60 px-5 py-2.5 rounded-full shadow-sm bg-white/80 backdrop-blur">
        <i class="fas fa-hand-pointer text-birch-accent"></i> 拨动魔方，点击进入对应板块
    </p>

    <!-- 模块快捷入口 -->
    <div class="relative z-10 mt-14 max-w-4xl px-4 w-full">
        <p class="text-center text-xs text-birch-accent/70 tracking-[.3em] mb-5">—— 探索更多板块 ——</p>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-sm">
            <a href="/timeline" class="bg-white/90 rounded-2xl border border-birch/60 shadow-sm p-4 text-center hover:-translate-y-1 hover:border-birch-accent hover:shadow-md transition">
                <i class="fas fa-history text-2xl text-birch-accent mb-2 block"></i>千年时间轴
            </a>
            <a href="/craft" class="bg-white/90 rounded-2xl border border-birch/60 shadow-sm p-4 text-center hover:-translate-y-1 hover:border-birch-accent hover:shadow-md transition">
                <i class="fas fa-hands text-2xl text-birch-accent mb-2 block"></i>工艺详解
            </a>
            <a href="/culture" class="bg-white/90 rounded-2xl border border-birch/60 shadow-sm p-4 text-center hover:-translate-y-1 hover:border-birch-accent hover:shadow-md transition">
                <i class="fas fa-globe-asia text-2xl text-birch-accent mb-2 block"></i>民族图谱
            </a>
            <a href="/quiz" class="bg-white/90 rounded-2xl border border-birch/60 shadow-sm p-4 text-center hover:-translate-y-1 hover:border-birch-accent hover:shadow-md transition">
                <i class="fas fa-trophy text-2xl text-birch-accent mb-2 block"></i>问答挑战
            </a>
            <a href="/about" class="bg-white/90 rounded-2xl border border-birch/60 shadow-sm p-4 text-center hover:-translate-y-1 hover:border-birch-accent hover:shadow-md transition col-span-2 sm:col-span-1">
                <i class="fas fa-comments text-2xl text-birch-accent mb-2 block"></i>留言交流
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const cube = document.getElementById('cube');
    let isDragging = false, startX, startY, currentX = -15, currentY = 20;
    let autoRotateY = 20, autoRotate = true, isClickAllowed = true;
    const getX = e => e.touches ? e.touches[0].clientX : e.clientX;
    const getY = e => e.touches ? e.touches[0].clientY : e.clientY;

    const dragStart = e => { isDragging = true; autoRotate = false; startX = getX(e); startY = getY(e); cube.style.transition = 'none'; isClickAllowed = true; };
    const dragMove = e => {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();
        const dx = getX(e) - startX, dy = getY(e) - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isClickAllowed = false;
        let nx = currentX - dy * 0.5, ny = currentY + dx * 0.5;
        if (nx > 80) nx = 80; if (nx < -80) nx = -80;
        cube.style.transform = `rotateX(${nx}deg) rotateY(${ny}deg)`;
    };
    const dragEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        const m = cube.style.transform.match(/rotateX\(([-0-9.]+)deg\) rotateY\(([-0-9.]+)deg\)/);
        if (m) { currentX = parseFloat(m[1]); currentY = parseFloat(m[2]); }
        autoRotateY = currentY; autoRotate = true;
        cube.style.transition = 'transform .1s linear';
    };
    cube.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', dragMove);
    document.addEventListener('mouseup', dragEnd);
    cube.addEventListener('touchstart', dragStart, { passive: false });
    document.addEventListener('touchmove', dragMove, { passive: false });
    document.addEventListener('touchend', dragEnd);
    cube.addEventListener('click', e => { if (!isClickAllowed) e.preventDefault(); }, true);

    (function animate() {
        if (autoRotate && !isDragging) {
            autoRotateY += 0.2; currentY = autoRotateY;
            cube.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
        }
        requestAnimationFrame(animate);
    })();
})();
</script>
{% endblock %}
