{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-tech-light/50 to-birch-light/60 flex items-center justify-center px-4 py-20">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-gray-100 p-10 fade-up">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-tech-blue text-white flex items-center justify-center mb-4 shadow-lg">
                <i class="fas fa-user-circle text-3xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-800">欢迎回来</h2>
            <p class="text-gray-400 text-sm mt-1">登录桦艺新生，解锁上传与留言功能</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-sm font-bold text-gray-600">用户名</label>
                <input id="login-username" class="w-full mt-1.5 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tech-blue/40" placeholder="请输入用户名">
            </div>
            <div>
                <label class="text-sm font-bold text-gray-600">密码</label>
                <input id="login-password" type="password" class="w-full mt-1.5 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tech-blue/40" placeholder="请输入密码" onkeypress="if(event.key==='Enter') doLogin()">
            </div>
            <p id="login-error" class="hidden text-sm text-rose-500 bg-rose-50 rounded-lg px-3 py-2"></p>
            <button onclick="doLogin()" id="login-btn"
                    class="w-full bg-tech-blue text-white py-3.5 rounded-xl font-bold hover:bg-blue-700 transition shadow-md">
                登 录
            </button>
        </div>

        <div class="mt-6 text-center text-sm text-gray-400">
            还没有账号？<a href="/register" class="text-tech-blue hover:underline font-medium">立即注册</a>
        </div>

        <div class="mt-6 bg-birch-light/60 rounded-xl p-4 text-xs text-gray-500 leading-relaxed">
            <p class="font-bold text-birch-dark mb-1"><i class="fas fa-door-open mr-1"></i>注册已全面开放</p>
            <p>本站支持自由注册，注册后即可上传素材、参与留言交流。管理员账号由团队内部管理，如需管理权限请联系站务。</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    err.classList.add('hidden');
    if (!username || !password) {
        err.textContent = '请填写用户名和密码';
        err.classList.remove('hidden');
        return;
    }
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
    const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
    });
    const data = await resp.json();
    if (data.ok) {
        location.href = '/';
    } else {
        btn.disabled = false;
        btn.innerText = '登 录';
        err.textContent = data.msg || '登录失败';
        err.classList.remove('hidden');
    }
}
</script>
{% endblock %}
